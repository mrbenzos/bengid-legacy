<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEIS273 - A-Frame Assessment (PracticalQuiz2)</title>
    <!-- A-Frame Framework (Standard for CEIS273 WebVR / 3D Graphics) -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }
        /* Clean Bottom Navigation Toolbar */
        .toolbar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            z-index: 9999;
        }
        .toolbar button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .toolbar button:hover {
            background: #10b981;
            border-color: #34d399;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- A-Frame VR / 3D Scene -->
    <a-scene background="color: #87ceeb" shadow="type: pcfsoft" renderer="antialias: true; colorManagement: true">
        
        <!-- ========================================== -->
        <!-- ASSETS: PROCEDURAL LABELS (NO 3D MODELS)   -->
        <!-- ========================================== -->
        <a-assets>
            <canvas id="miloCanvas" width="1024" height="512"></canvas>
            <canvas id="milkCanvas" width="1024" height="512"></canvas>
            <canvas id="stoneCanvas" width="256" height="256"></canvas>
            <canvas id="grassCanvas" width="512" height="512"></canvas>
        </a-assets>

        <!-- ========================================== -->
        <!-- LIGHTING & SKY                             -->
        <!-- ========================================== -->
        <a-sky id="sky" color="#7ec0ee"></a-sky>

        <a-entity light="type: ambient; color: #ffffff; intensity: 0.65"></a-entity>
        <a-entity id="sunLight" light="type: directional; color: #fff8ee; intensity: 1.1; castShadow: true; shadowMapHeight: 2048; shadowMapWidth: 2048; shadowCameraNear: 0.5; shadowCameraFar: 100; shadowCameraLeft: -25; shadowCameraRight: 25; shadowCameraTop: 25; shadowCameraBottom: -25;" position="20 30 15"></a-entity>

        <!-- Gazebo interior warm point light -->
        <a-entity id="gazeboLight" light="type: point; color: #ffb74d; intensity: 1.2; distance: 10; decay: 2; castShadow: true" position="0 5.5 0"></a-entity>

        <!-- ========================================== -->
        <!-- ENVIRONMENT (MATCHING REFERENCE IMAGE)     -->
        <!-- ========================================== -->
        
        <!-- Lawn / Ground Plane -->
        <a-plane rotation="-90 0 0" width="160" height="160" material="src: #grassCanvas; repeat: 16 16; roughness: 0.9; metalness: 0.05" shadow="receive: true"></a-plane>

        <!-- Curved Light-Green Garden Walls (Flanking the Gazebo) -->
        <!-- Left Wall -->
        <a-cylinder radius="24" height="12" open-ended="true" side="double" theta-start="145" theta-length="65" position="0 6 0" color="#98f6c4" material="roughness: 0.7; metalness: 0.05" shadow="cast: true; receive: true"></a-cylinder>
        
        <!-- Right Wall -->
        <a-cylinder radius="24" height="12" open-ended="true" side="double" theta-start="-30" theta-length="65" position="0 6 0" color="#98f6c4" material="roughness: 0.7; metalness: 0.05" shadow="cast: true; receive: true"></a-cylinder>

        <!-- Background Wall (Behind Gazebo) -->
        <a-cylinder radius="22" height="10" open-ended="true" side="double" theta-start="220" theta-length="100" position="0 5 0" color="#98f6c4" material="roughness: 0.7; metalness: 0.05" shadow="cast: true; receive: true"></a-cylinder>

        <!-- Stepping Stone Walkway leading to the Gazebo -->
        <a-entity id="walkway">
            <!-- 14 Stone Slabs -->
            <a-box position="0 0.08 7.0" width="3.6" height="0.16" depth="1.5" material="src: #stoneCanvas; color: #ffffff; roughness: 0.7" shadow="receive: true; cast: true"></a-box>
            <a-box position="0 0.08 9.0" width="3.6" height="0.16" depth="1.5" material="src: #stoneCanvas; color: #ffffff; roughness: 0.7" shadow="receive: true; cast: true"></a-box>
            <a-box position="0 0.08 11.0" width="3.6" height="0.16" depth="1.5" material="src: #stoneCanvas; color: #ffffff; roughness: 0.7" shadow="receive: true; cast: true"></a-box>
            <a-box position="0 0.08 13.0" width="3.6" height="0.16" depth="1.5" material="src: #stoneCanvas; color: #ffffff; roughness: 0.7" shadow="receive: true; cast: true"></a-box>
            <a-box position="0 0.08 15.0" width="3.6" height="0.16" depth="1.5" material="src: #stoneCanvas; color: #ffffff; roughness: 0.7" shadow="receive: true; cast: true"></a-box>
            <a-box position="0 0.08 17.0" width="3.6" height="0.16" depth="1.5" material="src: #stoneCanvas; color: #ffffff; roughness: 0.7" shadow="receive: true; cast: true"></a-box>
            <a-box position="0 0.08 19.0" width="3.6" height="0.16" depth="1.5" material="src: #stoneCanvas; color: #ffffff; roughness: 0.7" shadow="receive: true; cast: true"></a-box>
            <a-box position="0 0.08 21.0" width="3.6" height="0.16" depth="1.5" material="src: #stoneCanvas; color: #ffffff; roughness: 0.7" shadow="receive: true; cast: true"></a-box>
            <a-box position="0 0.08 23.0" width="3.6" height="0.16" depth="1.5" material="src: #stoneCanvas; color: #ffffff; roughness: 0.7" shadow="receive: true; cast: true"></a-box>
            <a-box position="0 0.08 25.0" width="3.6" height="0.16" depth="1.5" material="src: #stoneCanvas; color: #ffffff; roughness: 0.7" shadow="receive: true; cast: true"></a-box>
            <a-box position="0 0.08 27.0" width="3.6" height="0.16" depth="1.5" material="src: #stoneCanvas; color: #ffffff; roughness: 0.7" shadow="receive: true; cast: true"></a-box>
            <a-box position="0 0.08 29.0" width="3.6" height="0.16" depth="1.5" material="src: #stoneCanvas; color: #ffffff; roughness: 0.7" shadow="receive: true; cast: true"></a-box>
            <a-box position="0 0.08 31.0" width="3.6" height="0.16" depth="1.5" material="src: #stoneCanvas; color: #ffffff; roughness: 0.7" shadow="receive: true; cast: true"></a-box>
            <a-box position="0 0.08 33.0" width="3.6" height="0.16" depth="1.5" material="src: #stoneCanvas; color: #ffffff; roughness: 0.7" shadow="receive: true; cast: true"></a-box>
        </a-entity>

        <!-- ========================================== -->
        <!-- THE GAZEBO (100% PRIMITIVE ENTITIES)       -->
        <!-- ========================================== -->
        <a-entity id="gazebo">
            <!-- Tiered Circular Stone Base -->
            <a-cylinder radius="7.8" height="0.35" position="0 0.175 0" color="#f1f5f9" material="roughness: 0.7" shadow="receive: true; cast: true"></a-cylinder>
            <a-cylinder radius="7.0" height="0.35" position="0 0.525 0" color="#e2e8f0" material="roughness: 0.7" shadow="receive: true; cast: true"></a-cylinder>
            <a-cylinder radius="6.4" height="0.15" position="0 0.775 0" color="#99ddb3" material="roughness: 0.6" shadow="receive: true"></a-cylinder>

            <!-- 8 Gazebo Pillars (Columns in circle) -->
            <!-- Columns: radius 5.6 -->
            <a-cylinder radius="0.16" height="4.8" position="3.96 3.17 3.96" color="#ffffff" material="roughness: 0.4" shadow="cast: true; receive: true"></a-cylinder>
            <a-cylinder radius="0.16" height="4.8" position="5.6 3.17 0" color="#ffffff" material="roughness: 0.4" shadow="cast: true; receive: true"></a-cylinder>
            <a-cylinder radius="0.16" height="4.8" position="3.96 3.17 -3.96" color="#ffffff" material="roughness: 0.4" shadow="cast: true; receive: true"></a-cylinder>
            <a-cylinder radius="0.16" height="4.8" position="0 3.17 -5.6" color="#ffffff" material="roughness: 0.4" shadow="cast: true; receive: true"></a-cylinder>
            <a-cylinder radius="0.16" height="4.8" position="-3.96 3.17 -3.96" color="#ffffff" material="roughness: 0.4" shadow="cast: true; receive: true"></a-cylinder>
            <a-cylinder radius="0.16" height="4.8" position="-5.6 3.17 0" color="#ffffff" material="roughness: 0.4" shadow="cast: true; receive: true"></a-cylinder>
            <a-cylinder radius="0.16" height="4.8" position="-3.96 3.17 3.96" color="#ffffff" material="roughness: 0.4" shadow="cast: true; receive: true"></a-cylinder>

            <!-- Balustrade Handrail Panels (Leaving front entrance open) -->
            <a-box position="4.9 1.7 2.1" rotation="0 22 0" width="0.1" height="0.9" depth="3.8" color="#a8f0c6" material="roughness: 0.6" shadow="cast: true"></a-box>
            <a-box position="4.9 1.7 -2.1" rotation="0 -22 0" width="0.1" height="0.9" depth="3.8" color="#a8f0c6" material="roughness: 0.6" shadow="cast: true"></a-box>
            <a-box position="2.1 1.7 -4.9" rotation="0 68 0" width="0.1" height="0.9" depth="3.8" color="#a8f0c6" material="roughness: 0.6" shadow="cast: true"></a-box>
            <a-box position="-2.1 1.7 -4.9" rotation="0 -68 0" width="0.1" height="0.9" depth="3.8" color="#a8f0c6" material="roughness: 0.6" shadow="cast: true"></a-box>
            <a-box position="-4.9 1.7 -2.1" rotation="0 22 0" width="0.1" height="0.9" depth="3.8" color="#a8f0c6" material="roughness: 0.6" shadow="cast: true"></a-box>
            <a-box position="-4.9 1.7 2.1" rotation="0 -22 0" width="0.1" height="0.9" depth="3.8" color="#a8f0c6" material="roughness: 0.6" shadow="cast: true"></a-box>

            <!-- Gazebo Conical Roof (Mint Green matching prompt photo) -->
            <a-torus radius="5.7" radius-tubular="0.18" rotation="90 0 0" position="0 5.6 0" color="#ffffff" material="roughness: 0.3"></a-torus>
            <a-cone radius-bottom="6.5" radius-top="0" height="2.9" position="0 7.05 0" color="#7de6ad" material="roughness: 0.5; metalness: 0.1" shadow="cast: true; receive: true"></a-cone>
            <a-sphere radius="0.32" position="0 8.65 0" color="#f59e0b" material="roughness: 0.3; metalness: 0.6"></a-sphere>

            <!-- Hanging Chandelier / Lantern -->
            <a-cylinder radius="0.02" height="1.4" position="0 6.3 0" color="#333333"></a-cylinder>
            <a-octahedron radius="0.35" position="0 5.5 0" color="#ffedd5" material="emissive: #ffb74d; emissiveIntensity: 0.8; roughness: 0.2"></a-octahedron>
        </a-entity>

        <!-- ========================================== -->
        <!-- DINING TABLE & 4 CHAIRS                    -->
        <!-- ========================================== -->
        <a-entity id="diningSet" position="0 0.85 0">
            
            <!-- Table -->
            <a-entity id="table">
                <!-- Circular Tabletop -->
                <a-cylinder radius="2.0" height="0.12" position="0 2.0 0" color="#78350f" material="roughness: 0.45; metalness: 0.08" shadow="cast: true; receive: true"></a-cylinder>
                <a-cylinder radius="1.85" height="0.08" position="0 1.9 0" color="#451a03" material="roughness: 0.5"></a-cylinder>
                
                <!-- Tablecloth Center Mat -->
                <a-cylinder radius="1.5" height="0.015" position="0 2.065 0" color="#ffffff" material="roughness: 0.9" shadow="receive: true"></a-cylinder>

                <!-- Central Table Pedestal & Base -->
                <a-cylinder radius="0.22" height="1.8" position="0 1.0 0" color="#451a03" material="roughness: 0.5" shadow="cast: true"></a-cylinder>
                <a-cylinder radius="1.1" height="0.14" position="0 0.07 0" color="#451a03" material="roughness: 0.5" shadow="cast: true"></a-cylinder>
            </a-entity>

            <!-- 4 Chairs placed around table (Requirement was minimum of 2) -->
            <!-- Chair Template Entity: South -->
            <a-entity id="chairSouth" position="0 0 2.6" rotation="0 180 0">
                <a-cylinder radius="0.55" height="0.08" position="0 1.1 0" color="#78350f" material="roughness: 0.5" shadow="cast: true"></a-cylinder>
                <a-cylinder radius="0.48" height="0.05" position="0 1.15 0" color="#10b981" material="roughness: 0.7"></a-cylinder>
                <!-- Legs -->
                <a-cylinder radius="0.035" height="1.05" position="0.32 0.55 0.32" color="#451a03" shadow="cast: true"></a-cylinder>
                <a-cylinder radius="0.035" height="1.05" position="-0.32 0.55 0.32" color="#451a03" shadow="cast: true"></a-cylinder>
                <a-cylinder radius="0.035" height="1.05" position="0.32 0.55 -0.32" color="#451a03" shadow="cast: true"></a-cylinder>
                <a-cylinder radius="0.035" height="1.05" position="-0.32 0.55 -0.32" color="#451a03" shadow="cast: true"></a-cylinder>
                <!-- Backrest -->
                <a-cylinder radius="0.035" height="1.1" position="0.35 1.65 -0.35" color="#451a03" shadow="cast: true"></a-cylinder>
                <a-cylinder radius="0.035" height="1.1" position="-0.35 1.65 -0.35" color="#451a03" shadow="cast: true"></a-cylinder>
                <a-box width="0.8" height="0.25" depth="0.05" position="0 2.05 -0.35" color="#78350f" shadow="cast: true"></a-box>
            </a-entity>

            <!-- Chair North -->
            <a-entity id="chairNorth" position="0 0 -2.6" rotation="0 0 0">
                <a-cylinder radius="0.55" height="0.08" position="0 1.1 0" color="#78350f" material="roughness: 0.5" shadow="cast: true"></a-cylinder>
                <a-cylinder radius="0.48" height="0.05" position="0 1.15 0" color="#10b981" material="roughness: 0.7"></a-cylinder>
                <a-cylinder radius="0.035" height="1.05" position="0.32 0.55 0.32" color="#451a03" shadow="cast: true"></a-cylinder>
                <a-cylinder radius="0.035" height="1.05" position="-0.32 0.55 0.32" color="#451a03" shadow="cast: true"></a-cylinder>
                <a-cylinder radius="0.035" height="1.05" position="0.32 0.55 -0.32" color="#451a03" shadow="cast: true"></a-cylinder>
                <a-cylinder radius="0.035" height="1.05" position="-0.32 0.55 -0.32" color="#451a03" shadow="cast: true"></a-cylinder>
                <a-cylinder radius="0.035" height="1.1" position="0.35 1.65 -0.35" color="#451a03" shadow="cast: true"></a-cylinder>
                <a-cylinder radius="0.035" height="1.1" position="-0.35 1.65 -0.35" color="#451a03" shadow="cast: true"></a-cylinder>
                <a-box width="0.8" height="0.25" depth="0.05" position="0 2.05 -0.35" color="#78350f" shadow="cast: true"></a-box>
            </a-entity>

            <!-- Chair East -->
            <a-entity id="chairEast" position="2.6 0 0" rotation="0 -90 0">
                <a-cylinder radius="0.55" height="0.08" position="0 1.1 0" color="#78350f" material="roughness: 0.5" shadow="cast: true"></a-cylinder>
                <a-cylinder radius="0.48" height="0.05" position="0 1.15 0" color="#10b981" material="roughness: 0.7"></a-cylinder>
                <a-cylinder radius="0.035" height="1.05" position="0.32 0.55 0.32" color="#451a03" shadow="cast: true"></a-cylinder>
                <a-cylinder radius="0.035" height="1.05" position="-0.32 0.55 0.32" color="#451a03" shadow="cast: true"></a-cylinder>
                <a-cylinder radius="0.035" height="1.05" position="0.32 0.55 -0.32" color="#451a03" shadow="cast: true"></a-cylinder>
                <a-cylinder radius="0.035" height="1.05" position="-0.32 0.55 -0.32" color="#451a03" shadow="cast: true"></a-cylinder>
                <a-cylinder radius="0.035" height="1.1" position="0.35 1.65 -0.35" color="#451a03" shadow="cast: true"></a-cylinder>
                <a-cylinder radius="0.035" height="1.1" position="-0.35 1.65 -0.35" color="#451a03" shadow="cast: true"></a-cylinder>
                <a-box width="0.8" height="0.25" depth="0.05" position="0 2.05 -0.35" color="#78350f" shadow="cast: true"></a-box>
            </a-entity>

            <!-- Chair West -->
            <a-entity id="chairWest" position="-2.6 0 0" rotation="0 90 0">
                <a-cylinder radius="0.55" height="0.08" position="0 1.1 0" color="#78350f" material="roughness: 0.5" shadow="cast: true"></a-cylinder>
                <a-cylinder radius="0.48" height="0.05" position="0 1.15 0" color="#10b981" material="roughness: 0.7"></a-cylinder>
                <a-cylinder radius="0.035" height="1.05" position="0.32 0.55 0.32" color="#451a03" shadow="cast: true"></a-cylinder>
                <a-cylinder radius="0.035" height="1.05" position="-0.32 0.55 0.32" color="#451a03" shadow="cast: true"></a-cylinder>
                <a-cylinder radius="0.035" height="1.05" position="0.32 0.55 -0.32" color="#451a03" shadow="cast: true"></a-cylinder>
                <a-cylinder radius="0.035" height="1.05" position="-0.32 0.55 -0.32" color="#451a03" shadow="cast: true"></a-cylinder>
                <a-cylinder radius="0.035" height="1.1" position="0.35 1.65 -0.35" color="#451a03" shadow="cast: true"></a-cylinder>
                <a-cylinder radius="0.035" height="1.1" position="-0.35 1.65 -0.35" color="#451a03" shadow="cast: true"></a-cylinder>
                <a-box width="0.8" height="0.25" depth="0.05" position="0 2.05 -0.35" color="#78350f" shadow="cast: true"></a-box>
            </a-entity>
        </a-entity>

        <!-- ==================================================== -->
        <!-- REQUIRED TABLETOP ITEMS: MILO TIN, MILK TIN & 2 CUPS -->
        <!-- ==================================================== -->
        <a-entity id="tabletopItems" position="0 2.92 0">

            <!-- 1. MILO TIN -->
            <a-entity id="miloTin" position="-0.5 0 -0.2">
                <!-- Can Cylinder with Canvas Texture -->
                <a-cylinder radius="0.28" height="0.68" position="0 0.34 0" material="src: #miloCanvas; roughness: 0.35; metalness: 0.15" shadow="cast: true; receive: true"></a-cylinder>
                <!-- Gold Top Lid -->
                <a-cylinder radius="0.25" height="0.03" position="0 0.69 0" color="#ca8a04" material="metalness: 0.8; roughness: 0.3"></a-cylinder>
                <!-- Metallic Rims -->
                <a-torus radius="0.28" radius-tubular="0.015" rotation="90 0 0" position="0 0.68 0" color="#d1d5db" material="metalness: 0.9; roughness: 0.2"></a-torus>
                <a-torus radius="0.28" radius-tubular="0.015" rotation="90 0 0" position="0 0.01 0" color="#d1d5db" material="metalness: 0.9; roughness: 0.2"></a-torus>
            </a-entity>

            <!-- 2. MILK TIN (Ideal / Evaporated Milk) -->
            <a-entity id="milkTin" position="0.45 0 -0.3">
                <!-- Can Cylinder with Canvas Texture -->
                <a-cylinder radius="0.23" height="0.52" position="0 0.26 0" material="src: #milkCanvas; roughness: 0.3; metalness: 0.2" shadow="cast: true; receive: true"></a-cylinder>
                <!-- Metallic Rims -->
                <a-torus radius="0.23" radius-tubular="0.013" rotation="90 0 0" position="0 0.52 0" color="#d1d5db" material="metalness: 0.9; roughness: 0.2"></a-torus>
                <a-torus radius="0.23" radius-tubular="0.013" rotation="90 0 0" position="0 0.01 0" color="#d1d5db" material="metalness: 0.9; roughness: 0.2"></a-torus>
                <!-- Puncture Pouring Holes -->
                <a-cylinder radius="0.025" height="0.01" position="0.12 0.525 0" color="#111111"></a-cylinder>
                <a-cylinder radius="0.025" height="0.01" position="-0.12 0.525 0" color="#111111"></a-cylinder>
            </a-entity>

            <!-- 3. CUP 1 (White Ceramic Cup with Hot Drink & Saucer) -->
            <a-entity id="cup1" position="-0.32 0 0.6">
                <!-- Saucer -->
                <a-cylinder radius="0.42" height="0.035" position="0 0.018 0" color="#ffffff" material="roughness: 0.2; metalness: 0.05" shadow="cast: true"></a-cylinder>
                <!-- Cup Body -->
                <a-cylinder radius="0.22" height="0.34" position="0 0.2 0" color="#ffffff" material="roughness: 0.2; metalness: 0.05" shadow="cast: true"></a-cylinder>
                <a-torus radius="0.21" radius-tubular="0.015" rotation="90 0 0" position="0 0.37 0" color="#ffffff"></a-torus>
                <!-- Cup Handle -->
                <a-torus radius="0.12" radius-tubular="0.028" arc="200" rotation="0 0 90" position="0.24 0.2 0" color="#ffffff"></a-torus>
                <!-- Hot Cocoa/Milo Drink Surface -->
                <a-cylinder radius="0.2" height="0.01" position="0 0.32 0" color="#3d1a04" material="roughness: 0.2"></a-cylinder>
                <!-- Spoon -->
                <a-box width="0.03" height="0.01" depth="0.45" position="0.24 0.03 0.15" rotation="0 30 0" color="#e2e8f0" material="metalness: 0.8; roughness: 0.2"></a-box>
            </a-entity>

            <!-- 4. CUP 2 (Pastel Blue Ceramic Cup with Hot Drink & Saucer) -->
            <a-entity id="cup2" position="0.55 0 0.3">
                <!-- Saucer -->
                <a-cylinder radius="0.42" height="0.035" position="0 0.018 0" color="#e0f2fe" material="roughness: 0.2; metalness: 0.05" shadow="cast: true"></a-cylinder>
                <!-- Cup Body -->
                <a-cylinder radius="0.22" height="0.34" position="0 0.2 0" color="#e0f2fe" material="roughness: 0.2; metalness: 0.05" shadow="cast: true"></a-cylinder>
                <a-torus radius="0.21" radius-tubular="0.015" rotation="90 0 0" position="0 0.37 0" color="#e0f2fe"></a-torus>
                <!-- Cup Handle -->
                <a-torus radius="0.12" radius-tubular="0.028" arc="200" rotation="0 0 -90" position="-0.24 0.2 0" color="#e0f2fe"></a-torus>
                <!-- Hot Cocoa/Milo Drink Surface -->
                <a-cylinder radius="0.2" height="0.01" position="0 0.32 0" color="#3d1a04" material="roughness: 0.2"></a-cylinder>
                <!-- Spoon -->
                <a-box width="0.03" height="0.01" depth="0.45" position="-0.24 0.03 0.15" rotation="0 -30 0" color="#e2e8f0" material="metalness: 0.8; roughness: 0.2"></a-box>
            </a-entity>

            <!-- Beautification Centerpiece: Fresh Fruit Bowl -->
            <a-sphere radius="0.36" theta-start="0" theta-length="90" rotation="180 0 0" position="0 0.35 0" color="#ffffff" material="roughness: 0.2"></a-sphere>
            <a-sphere radius="0.1" position="0.08 0.25 0.05" color="#dc2626" material="roughness: 0.3"></a-sphere>
            <a-sphere radius="0.1" position="-0.08 0.25 0.05" color="#dc2626" material="roughness: 0.3"></a-sphere>
            <a-sphere radius="0.09" position="0 0.28 -0.08" color="#16a34a" material="roughness: 0.3"></a-sphere>
        </a-entity>

        <!-- ========================================== -->
        <!-- BEAUTIFICATION: TREES, SHRUBS & LIGHTS     -->
        <!-- ========================================== -->
        <!-- Trees -->
        <a-entity id="gardenTrees">
            <!-- Left Trees -->
            <a-entity position="-18 0 8">
                <a-cylinder radius="0.4" height="3.5" position="0 1.75 0" color="#4a2e18"></a-cylinder>
                <a-cone radius-bottom="2.4" height="3" position="0 4.0 0" color="#2e7d32"></a-cone>
                <a-cone radius-bottom="1.9" height="2.5" position="0 5.4 0" color="#2e7d32"></a-cone>
                <a-cone radius-bottom="1.3" height="2" position="0 6.6 0" color="#2e7d32"></a-cone>
            </a-entity>
            <a-entity position="-14 0 22">
                <a-cylinder radius="0.35" height="3.2" position="0 1.6 0" color="#4a2e18"></a-cylinder>
                <a-cone radius-bottom="2.2" height="2.8" position="0 3.7 0" color="#2e7d32"></a-cone>
                <a-cone radius-bottom="1.7" height="2.3" position="0 5.0 0" color="#2e7d32"></a-cone>
            </a-entity>
            <!-- Right Trees -->
            <a-entity position="18 0 8">
                <a-cylinder radius="0.4" height="3.5" position="0 1.75 0" color="#4a2e18"></a-cylinder>
                <a-cone radius-bottom="2.4" height="3" position="0 4.0 0" color="#2e7d32"></a-cone>
                <a-cone radius-bottom="1.9" height="2.5" position="0 5.4 0" color="#2e7d32"></a-cone>
                <a-cone radius-bottom="1.3" height="2" position="0 6.6 0" color="#2e7d32"></a-cone>
            </a-entity>
            <a-entity position="14 0 22">
                <a-cylinder radius="0.35" height="3.2" position="0 1.6 0" color="#4a2e18"></a-cylinder>
                <a-cone radius-bottom="2.2" height="2.8" position="0 3.7 0" color="#2e7d32"></a-cone>
                <a-cone radius-bottom="1.7" height="2.3" position="0 5.0 0" color="#2e7d32"></a-cone>
            </a-entity>
        </a-entity>

        <!-- Pathway Flower Bushes -->
        <a-entity id="flowerBushes">
            <a-sphere radius="0.6" scale="1.4 0.8 1.4" position="-2.8 0.5 10" color="#22c55e"></a-sphere>
            <a-sphere radius="0.6" scale="1.4 0.8 1.4" position="2.8 0.5 10" color="#22c55e"></a-sphere>
            <a-sphere radius="0.6" scale="1.4 0.8 1.4" position="-2.8 0.5 16" color="#22c55e"></a-sphere>
            <a-sphere radius="0.6" scale="1.4 0.8 1.4" position="2.8 0.5 16" color="#22c55e"></a-sphere>
            <a-sphere radius="0.6" scale="1.4 0.8 1.4" position="-2.8 0.5 22" color="#22c55e"></a-sphere>
            <a-sphere radius="0.6" scale="1.4 0.8 1.4" position="2.8 0.5 22" color="#22c55e"></a-sphere>
        </a-entity>

        <!-- ========================================== -->
        <!-- CAMERA RIG WITH CONTROLS                   -->
        <!-- ========================================== -->
        <a-entity id="rig" position="0 8 36" rotation="-8 0 0">
            <a-camera id="mainCamera" look-controls="pointerLockEnabled: false" wasd-controls="acceleration: 45">
                <a-cursor color="#5eead4" fuse="false" opacity="0.6" raycaster="objects: .clickable"></a-cursor>
            </a-camera>
        </a-entity>

    </a-scene>

    <!-- Bottom Controls Toolbar (Corner boards removed!) -->
    <div class="toolbar">
        <button onclick="setCameraView('scene')">🌐 Full Scene</button>
        <button onclick="setCameraView('table')">🔍 Inspect Table Items</button>
        <button onclick="setCameraView('walkway')">🚶 Walkway View</button>
        <button id="timeBtn" onclick="toggleLighting()">🌙 Night Mode</button>
    </div>

    <!-- ========================================== -->
    <!-- PROCEDURAL TEXTURE GENERATION SCRIPT       -->
    <!-- ========================================== -->
    <script>
        // 1. Procedural Milo Canvas Label
        (function initMiloLabel() {
            const canvas = document.getElementById('miloCanvas');
            const ctx = canvas.getContext('2d');

            // Rich Milo Emerald Green
            ctx.fillStyle = '#00632a';
            ctx.fillRect(0, 0, 1024, 512);

            // Gold/White Energy Stripes
            ctx.fillStyle = '#f5c518';
            ctx.beginPath();
            ctx.moveTo(0, 380); ctx.lineTo(1024, 260); ctx.lineTo(1024, 305); ctx.lineTo(0, 425);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(0, 430); ctx.lineTo(1024, 310); ctx.lineTo(1024, 325); ctx.lineTo(0, 445);
            ctx.fill();

            // Repeating Milo Branding for 360 wrap
            [260, 770].forEach(cx => {
                ctx.fillStyle = '#d31018';
                ctx.font = 'bold 30px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Nestlé®', cx, 140);

                // MILO Bold Letters with Brown Shadow
                ctx.font = '900 112px "Arial Black", Impact, sans-serif';
                ctx.fillStyle = '#4a2511';
                ctx.fillText('MILO', cx + 5, 245 + 5);
                ctx.fillStyle = '#ffde00';
                ctx.fillText('MILO', cx, 245);

                // ACTIV-GO Badge
                ctx.fillStyle = '#d31018';
                ctx.beginPath();
                ctx.roundRect(cx - 130, 275, 260, 42, 21);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 22px sans-serif';
                ctx.fillText('ACTIV-GO®', cx, 304);

                ctx.fillStyle = '#ffd15c';
                ctx.font = '600 20px sans-serif';
                ctx.fillText('CHOC-MALT NOURISHING DRINK', cx, 360);

                ctx.fillStyle = '#ffffff';
                ctx.font = '14px sans-serif';
                ctx.fillText('Net Weight 400g • Ghana Favorite', cx, 460);
            });
        })();

        // 2. Procedural Ideal / Evaporated Milk Canvas Label
        (function initMilkLabel() {
            const canvas = document.getElementById('milkCanvas');
            const ctx = canvas.getContext('2d');

            // Blue & White Split
            ctx.fillStyle = '#0f4c81';
            ctx.fillRect(0, 0, 1024, 260);
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(0, 260, 1024, 252);

            // Red Ribbon
            ctx.fillStyle = '#dc2626';
            ctx.fillRect(0, 250, 1024, 20);

            [260, 770].forEach(cx => {
                ctx.fillStyle = '#f59e0b';
                ctx.beginPath();
                ctx.arc(cx, 90, 30, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#0f4c81';
                ctx.font = 'bold 22px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('★', cx, 98);

                ctx.font = '900 84px "Arial Black", Impact, sans-serif';
                ctx.fillStyle = '#ffffff';
                ctx.fillText('IDEAL', cx, 190);

                ctx.font = '900 46px sans-serif';
                ctx.fillStyle = '#0f4c81';
                ctx.fillText('EVAPORATED', cx, 330);

                ctx.fillStyle = '#dc2626';
                ctx.font = 'bold 36px sans-serif';
                ctx.fillText('MILK', cx, 380);

                ctx.fillStyle = '#475569';
                ctx.font = 'bold 18px sans-serif';
                ctx.fillText('Rich & Creamy • Full Cream', cx, 430);
                ctx.font = '14px sans-serif';
                ctx.fillText('160g Net Weight', cx, 460);
            });
        })();

        // 3. Procedural Grass Texture Canvas
        (function initGrassCanvas() {
            const canvas = document.getElementById('grassCanvas');
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#499b33';
            ctx.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 3000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#5cb83c' : '#3d8329';
                ctx.fillRect(Math.random()*512, Math.random()*512, 2, 2);
            }
            ctx.strokeStyle = 'rgba(40, 85, 25, 0.15)';
            ctx.lineWidth = 4;
            for (let x = 0; x <= 512; x += 64) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 512); ctx.stroke();
            }
            for (let y = 0; y <= 512; y += 64) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(512, y); ctx.stroke();
            }
        })();

        // 4. Procedural Stone Walkway Texture Canvas
        (function initStoneCanvas() {
            const canvas = document.getElementById('stoneCanvas');
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#e2e8f0';
            ctx.fillRect(0, 0, 256, 256);
            for (let i = 0; i < 1200; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#cbd5e1' : '#f8fafc';
                ctx.fillRect(Math.random()*256, Math.random()*256, 3, 3);
            }
        })();

        // ========================================== -->
        // CAMERA VIEW CONTROLS                       -->
        // ========================================== -->
        function setCameraView(view) {
            const rig = document.getElementById('rig');
            if (view === 'scene') {
                rig.setAttribute('animation', 'property: position; to: 0 8 36; dur: 1200; easing: easeInOutCubic');
                rig.setAttribute('animation__rot', 'property: rotation; to: -8 0 0; dur: 1200; easing: easeInOutCubic');
            } else if (view === 'table') {
                // Zoom right up to the table to inspect Milo, Milk & Cups
                rig.setAttribute('animation', 'property: position; to: 0.6 4.2 2.2; dur: 1200; easing: easeInOutCubic');
                rig.setAttribute('animation__rot', 'property: rotation; to: -18 10 0; dur: 1200; easing: easeInOutCubic');
            } else if (view === 'walkway') {
                rig.setAttribute('animation', 'property: position; to: 0 2.5 28; dur: 1200; easing: easeInOutCubic');
                rig.setAttribute('animation__rot', 'property: rotation; to: 2 0 0; dur: 1200; easing: easeInOutCubic');
            }
        }

        let isNight = false;
        function toggleLighting() {
            isNight = !isNight;
            const sky = document.getElementById('sky');
            const sun = document.getElementById('sunLight');
            const gazeboLight = document.getElementById('gazeboLight');
            const btn = document.getElementById('timeBtn');

            if (isNight) {
                sky.setAttribute('color', '#0a1128');
                sun.setAttribute('light', 'intensity: 0.15; color: #818cf8');
                gazeboLight.setAttribute('light', 'intensity: 3.5; distance: 20');
                btn.textContent = '☀️ Day Mode';
            } else {
                sky.setAttribute('color', '#7ec0ee');
                sun.setAttribute('light', 'intensity: 1.1; color: #fff8ee');
                gazeboLight.setAttribute('light', 'intensity: 1.2; distance: 10');
                btn.textContent = '🌙 Night Mode';
            }
        }
    </script>
</body>
</html>
